<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <title>KisanProcure - Smart Queue Pass</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --kp-primary: #1b4332;
      --kp-primary-light: #2d6a4f;
      --kp-accent: #52b788;
      --kp-bg: #f4f7f5;
      --kp-card-bg: #ffffff;
    }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--kp-bg);
      color: #212529;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .pass-container {
      max-width: 400px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      padding: 1.5rem;
    }
    .pass-header {
      background: linear-gradient(135deg, var(--kp-primary), var(--kp-primary-light));
      color: white;
      padding: 1.25rem;
      text-align: center;
      border-radius: 12px 12px 0 0;
    }
    .pass-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .pass-header .subtitle {
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .qr-section {
      text-align: center;
      margin: 1.25rem 0;
      padding: 1rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .qr-section img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
    }
    .pass-details {
      margin: 1rem 0;
    }
    .pass-detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #e9ecef;
      font-size: 0.9rem;
    }
    .pass-detail-row:last-child {
      border-bottom: none;
    }
    .pass-detail-label {
      color: #6c757d;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    .pass-detail-value {
      font-weight: 600;
      color: #1d3557;
      text-align: right;
    }
    .pass-status {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 50rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }
    .status-active {
      background-color: rgba(82, 183, 136, 0.15);
      color: #1b4332;
    }
    .status-verified {
      background-color: rgba(13, 110, 253, 0.15);
      color: #0d6efd;
    }
    .status-cancelled {
      background-color: rgba(220, 53, 69, 0.15);
      color: #dc3545;
    }
    .pass-footer {
      text-align: center;
      padding-top: 1rem;
      border-top: 2px dashed #dee2e6;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #6c757d;
    }
    .action-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .btn-kp-primary {
      background-color: var(--kp-primary);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-kp-primary:hover {
      background-color: var(--kp-primary-light);
      color: white;
    }
    .btn-kp-outline {
      background-color: white;
      color: var(--kp-primary);
      border: 2px solid var(--kp-primary);
      border-radius: 8px;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-kp-outline:hover {
      background-color: var(--kp-primary);
      color: white;
    }
    @media print {
      body {
        background: white;
        padding: 0;
        display: block;
      }
      .pass-container {
        box-shadow: none;
        max-width: 100%;
        padding: 0.5rem;
      }
      .action-buttons {
        display: none !important;
      }
      .pass-header {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .qr-section img {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="pass-container" id="passContainer">
     <div class="pass-header">
      <h1><i class="fa-solid fa-qrcode me-2"></i>KISANPROCURE</h1>
      <div class="subtitle">SMART QUEUE PASS</div>
    </div>

    <div id="passLoading" class="text-center py-4">
      <span class="spinner-border" role="status" aria-hidden="true" style="color: var(--kp-primary);"></span>
      <p class="text-muted small mb-0 mt-3">Loading your Smart Queue Pass...</p>
    </div>

    <div id="passError" class="alert alert-warning d-none mt-3" role="alert"></div>

    <div id="passContent" class="d-none">
      <div class="qr-section">
        <img id="qrCode" src="" alt="Smart Queue Pass QR Code">
      </div>

      <div class="pass-details" id="passDetails"></div>

      <div class="pass-footer">
        <p class="mb-0"><i class="fa-solid fa-triangle-exclamation me-1 text-warning"></i>Show this QR at the mandi entry desk</p>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-kp-outline" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print / Download
      </button>
      <button class="btn-kp-primary" onclick="window.close()">
        <i class="fa-solid fa-xmark"></i> Close
      </button>
    </div>
  </div>

  <!-- Shared auth helpers: Bearer header injection + 401 -> /login redirect. -->
  <script src="/static/js/auth.js"></script>
  <script>
    /* This page is a PUBLIC HTML shell: the server embeds NO pass, QR code or
       farmer data - only the booking id from the URL. The pass is requested
       from the authenticated JSON API below, where window.KP.authFetch()
       attaches the Bearer token as an Authorization header. Tokens are never
       placed in a URL and the API remains fully protected. */
    const BOOKING_ID = {{ booking_id|tojson }};
    const PASS_ENDPOINT = '/api/queue-pass/my/' + encodeURIComponent(BOOKING_ID) + '/display';

    let passData = null;

    /* Build a detail row with DOM nodes so pass values are never treated as
       HTML (no markup injection from server-provided strings). */
    function addDetailRow(label, value) {
      const row = document.createElement('div');
      row.className = 'pass-detail-row';

      const labelEl = document.createElement('span');
      labelEl.className = 'pass-detail-label';
      labelEl.textContent = label;

      const valueEl = document.createElement('span');
      valueEl.className = 'pass-detail-value';
      if (value && typeof value === 'object' && value.nodeType === 1) {
        valueEl.appendChild(value);
      } else {
        valueEl.textContent = value || '---';
      }

      row.appendChild(labelEl);
      row.appendChild(valueEl);
      return row;
    }

    function populatePassDetails() {
      const container = document.getElementById('passDetails');
      container.innerHTML = '';

      const rows = [
        { label: 'Farmer', value: passData.farmer_name || '---' },
        { label: 'Booking ID', value: passData.booking_id ? '#' + passData.booking_id : '---' },
        { label: 'Centre', value: passData.centre_name || '---' },
        { label: 'Crop', value: passData.crop_name || '---' },
        { label: 'Date', value: passData.slot_date || '---' },
        { label: 'Slot', value: (passData.start_time || '') + ' - ' + (passData.end_time || '') },
        { label: 'Token', value: passData.token_number || '---' },
      ];
      rows.forEach(row => container.appendChild(addDetailRow(row.label, row.value)));

      const statusBadge = document.createElement('span');
      statusBadge.className = 'pass-status';
      const status = passData.pass_status || 'ACTIVE';
      if (status === 'ACTIVE') {
        statusBadge.classList.add('status-active');
        statusBadge.textContent = 'Entry Pass Active';
      } else if (status === 'VERIFIED') {
        statusBadge.classList.add('status-verified');
        statusBadge.textContent = 'Entry Verified';
      } else if (status === 'CANCELLED') {
        statusBadge.classList.add('status-cancelled');
        statusBadge.textContent = 'Pass Cancelled';
      } else {
        statusBadge.classList.add('status-active');
        statusBadge.textContent = status;
      }
      container.appendChild(addDetailRow('Pass Status', statusBadge));
    }

    function setQRCode() {
      const qrImg = document.getElementById('qrCode');
      // The QR image encodes ONLY the opaque secure pass id; no farmer,
      // booking, phone, bank or token data is ever encoded.
      if (passData.qr_code_base64) {
        qrImg.src = 'data:image/png;base64,' + passData.qr_code_base64;
      } else {
        qrImg.src = '/static/icons/icon-192.png';
      }
    }

    function renderPass(data) {
      passData = data;
      populatePassDetails();
      setQRCode();
      document.getElementById('passLoading').classList.add('d-none');
      document.getElementById('passContent').classList.remove('d-none');
    }

    function showError(message) {
      const errorBox = document.getElementById('passError');
      errorBox.textContent = message;
      errorBox.classList.remove('d-none');
      document.getElementById('passLoading').classList.add('d-none');
      document.getElementById('passContent').classList.add('d-none');
    }

    /* Fetch the pass from the protected JSON API with the farmer's Bearer
       token (header only) and render it. Ownership is enforced server-side, so
       another farmer's booking id simply returns 404 here. */
    function loadPass() {
      if (!Number.isInteger(BOOKING_ID)) {
        showError('No Smart Queue Pass found for this booking.');
        return;
      }
      if (!window.KP || typeof window.KP.authFetch !== 'function') {
        showError('Unable to load the Smart Queue Pass. Please refresh the page.');
        return;
      }

      window.KP.authFetch(PASS_ENDPOINT)
        .then(function (res) {
          if (res.status === 401) {
            // authFetch() has already redirected an expired session to /login.
            showError('Session expired. Please login again.');
            return null;
          }
          if (!res.ok) {
            return res.json()
              .catch(function () { return null; })
              .then(function (body) {
                showError(
                  (body && body.message) ||
                  'No Smart Queue Pass found for this booking.'
                );
                return null;
              });
          }
          return res.json();
        })
        .then(function (data) {
          if (!data) {
            return;
          }
          if (!data.pass_data) {
            showError('No Smart Queue Pass found for this booking.');
            return;
          }
          renderPass(data.pass_data);
        })
        .catch(function () {
          showError('Network error. Please check your connection and try again.');
        });
    }

    document.addEventListener('DOMContentLoaded', loadPass);
  </script>
</body>
</html>
