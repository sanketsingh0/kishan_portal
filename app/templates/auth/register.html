<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <link rel="manifest" href="/static/manifest.json">
  <title>Register - KisanProcure</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --kp-primary: #1b4332;
      --kp-primary-light: #2d6a4f;
      --kp-accent: #52b788;
      --kp-bg: #f4f7f5;
    }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--kp-bg);
      color: #212529;
      min-height: 100vh;
    }
    .auth-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #f4f7f5 0%, #d8eee2 100%);
    }
    .auth-card {
      max-width: 460px;
      width: 100%;
      border: none;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(27, 67, 50, 0.14);
    }
    .auth-header {
      background: linear-gradient(135deg, var(--kp-primary), var(--kp-primary-light));
      color: #fff;
      border-radius: 18px 18px 0 0;
      padding: 1.75rem 1.5rem;
      text-align: center;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .auth-header p {
      margin-bottom: 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }
    .btn-kp-primary {
      background-color: var(--kp-primary);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      padding: 0.65rem 1.2rem;
      border: none;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    .btn-kp-primary:hover, .btn-kp-primary:focus {
      background-color: var(--kp-primary-light);
      color: #fff;
    }
    .btn-kp-primary:disabled {
      background-color: #9db8a8;
      cursor: not-allowed;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.9rem;
    }
    a.link-kp {
      color: var(--kp-primary);
      font-weight: 600;
      text-decoration: none;
    }
    a.link-kp:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-bg">
    <div class="card auth-card">
      <div class="auth-header">
        <h1>KisanProcure</h1>
        <p>Create your farmer account</p>
      </div>
      <div class="card-body p-4">
        <!-- Error / message area -->
        <div id="registerAlert" class="alert d-none alert-dismissible fade show" role="alert" aria-live="assertive">
          <span id="registerAlertMsg"></span>
          <button type="button" class="btn-close" onclick="hideAlert()" aria-label="Close"></button>
        </div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input type="text" class="form-control form-control-lg" id="name" name="name" autocomplete="name" required placeholder="Your full name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone <span class="text-muted small">(optional)</span></label>
            <input type="tel" class="form-control form-control-lg" id="phone" name="phone" autocomplete="tel" placeholder="10-digit mobile number">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" class="form-control form-control-lg" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="6" placeholder="Re-enter your password">
          </div>
          <button type="submit" id="registerBtn" class="btn btn-kp-primary btn-lg">
            <i class="fa-solid fa-user-plus me-2"></i>Register as Farmer
          </button>
        </form>

        <!-- Shown when Supabase email confirmation is required (no session returned). -->
        <div id="registerSuccess" class="d-none text-center py-3">
          <i class="fa-solid fa-envelope-circle-check fa-3x text-success mb-2"></i>
          <h5 class="fw-bold mb-2">Registration successful!</h5>
          <p class="text-muted mb-3">Please confirm your email before logging in. Check your inbox (and spam folder) for the confirmation link.</p>
          <a href="/login" class="btn btn-kp-primary btn-lg">Go to Login</a>
          <p class="small text-muted mt-3 mb-0">Redirecting to login...</p>
        </div>

        <p class="text-center mt-4 mb-0 small text-muted">
          Already have an account?
          <a href="/login" class="link-kp">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script>
function hideAlert() {
      const box = document.getElementById("registerAlert");
      box.classList.add("d-none");
    }

    function showAlert(msg, type) {
      const box = document.getElementById("registerAlert");
      const msgEl = document.getElementById("registerAlertMsg");
      box.className = `alert alert-${type} alert-dismissible fade show`;
      msgEl.innerText = msg;
      box.classList.remove("d-none");
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function getValidationErrors() {
      const errors = [];
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!name) errors.push("Full name is required.");
      if (!email) errors.push("Email is required.");
      else if (!isValidEmail(email)) errors.push("Please enter a valid email address.");
      if (!password) errors.push("Password is required.");
      else if (password.length < 6) errors.push("Password must be at least 6 characters long.");
      if (confirmPassword !== password) errors.push("Passwords do not match.");
      return errors;
    }

    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      hideAlert();

      const errors = getValidationErrors();
      if (errors.length) {
        showAlert(errors.join(" "), "danger");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;

      const btn = document.getElementById("registerBtn");
      const originalLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Creating account...`;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password, name: name, phone: phone || null })
        });

        const data = await res.json();

        if (!res.ok) {
          if (res.status === 503) {
            showAlert("Registration service is temporarily unavailable. Please try again later.", "danger");
          } else if (res.status === 409) {
            showAlert(data.message || "An account with this email already exists.", "danger");
          } else if (res.status === 400 && data.messages) {
            showAlert(data.messages.join(" "), "danger");
          } else {
            showAlert(data.message || data.error || "Registration failed. Please try again.", "danger");
          }
          return;
        }

        const user = data.user || {};
        const accessToken = user.access_token;

        if (accessToken) {
          // Account is immediately authenticated (email confirmation off).
          localStorage.setItem("kp_access_token", accessToken);
          if (user.refresh_token) {
            localStorage.setItem("kp_refresh_token", user.refresh_token);
          }
          window.location.href = "/farmer/dashboard";
          return;
        }

        // No session returned: Supabase email confirmation is required.
        // Do not claim the account is authenticated. Show a confirmation notice
        // then direct the user to login.

        document.getElementById("registerForm").classList.add("d-none");
        document.getElementById("registerSuccess").classList.remove("d-none");
        setTimeout(function () {
          window.location.href = "/login";
        }, 3500);
      } catch (err) {
        console.error("Register error:", err);
        showAlert("Network error. Please check your connection and try again.", "danger");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    });
  </script>
</body>
</html>
