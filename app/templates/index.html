<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <link rel="manifest" href="/static/manifest.json">
  <title>KisanProcure</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; padding: 2rem; background: #f4f7f6; color: #1b3a2f; }
    main { max-width: 640px; margin: 6rem auto; text-align: center; }
    h1 { font-size: 2.4rem; margin-bottom: 0.25rem; }
    .tag { color: #2e7d32; font-weight: 600; }
    .box { background: #fff; border: 1px solid #e0e7e3; border-radius: 10px;
           padding: 1.5rem; margin-top: 1.5rem; }
    a { color: #1b5e20; }
    .auth-actions { display: flex; gap: 0.75rem; justify-content: center;
                      margin-top: .1rem; flex-wrap: wrap; }
    .btn-link { display: inline-block; background: #1b4332; color: #fff;
                  text-decoration: none; padding: 0.55rem 1.2rem;
                  border-radius: 8px; font-weight: 600; }
    .btn-link:hover { background: #2d6a4f; color: #fff; }
    code { background: #eef3f0; padding: 0.1rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>KisanProcure</h1>
    <p class="tag">SIH Prototype &middot; Problem Statement 26032</p>
    <div class="box">
      <p>Welcome to KisanProcure — the digital procurement platform for farmers.</p>
      <div id="guestActions" class="auth-actions">
        <a href="/login" class="btn-link">Login</a>
        <a href="/register" class="btn-link">Register as Farmer</a>
      </div>
      <div id="authActions" class="auth-actions" style="display:none">
        <a href="/farmer/dashboard" class="btn-link">Farmer Dashboard</a>
        <a href="/admin/dashboard" class="btn-link">Admin Dashboard</a>
      </div>
      <p class="health-link">System status: <a href="/api/health">/api/health</a></p>
    </div>
  </main>

  <script>
    // If already authenticated, show dashboards instead of login/register.
    if (localStorage.getItem("kp_access_token")) {
      const guest = document.getElementById("guestActions");
      const auth = document.getElementById("authActions");
      if (guest) guest.style.display = "none";
      if (auth) auth.style.display = "flex";
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
