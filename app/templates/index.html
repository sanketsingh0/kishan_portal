<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <link rel="manifest" href="/static/manifest.json">
  <title>KisanProcure</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; padding: 2rem; background: #f4f7f6; color: #1b3a2f; }
    main { max-width: 640px; margin: 6rem auto; text-align: center; }
    h1 { font-size: 2.4rem; margin-bottom: 0.25rem; }
    .tag { color: #2e7d32; font-weight: 600; }
    .box { background: #fff; border: 1px solid #e0e7e3; border-radius: 10px;
           padding: 1.5rem; margin-top: 1.5rem; }
    a { color: #1b5e20; }
    code { background: #eef3f0; padding: 0.1rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>KisanProcure</h1>
    <p class="tag">SIH Prototype &middot; Problem Statement 26032</p>
    <div class="box">
      <p>The application foundation is up and running.</p>
      <p>Check the API health endpoint: <a href="/api/health">/api/health</a></p>
      <p>Farmer Dashboard: <a href="/farmer/dashboard">/farmer/dashboard</a></p>
      <p>Admin Dashboard: <a href="/admin/dashboard">/admin/dashboard</a></p>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
