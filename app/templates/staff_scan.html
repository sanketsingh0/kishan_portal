<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KisanProcure - Scan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body{font-family:system-ui,sans-serif;background:#0b1512;color:#fff;margin:0;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;background:#1b4332;padding:12px 14px;display:flex;align-items:center;gap:10px}
.topbar a.back{color:#fff;text-decoration:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);border-radius:12px}
.stage{position:relative;width:100%;height:55vh;min-height:340px;background:#000;overflow:hidden}
#nativePreview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.box{width:min(70vw,280px);aspect-ratio:1;border:3px solid #52b788;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.panel{background:#fff;color:#212529;border-radius:18px 18px 0 0;margin-top:-16px;position:relative;z-index:10;padding:14px}
.btn-kp{background:#1b4332;color:#fff;font-weight:700;border-radius:12px}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.82rem;text-shadow:0 1px 6px #000;z-index:6}
#debugLine{font-size:.72rem;color:#6c757d;word-break:break-all}
</style>
</head>
<body>
<div class="topbar">
<a class="back" href="/staff/dashboard"><i class="fa-solid fa-arrow-left"></i></a>
<div><div class="fw-bold">Scan Queue Pass</div><small id="centreLabel">rear camera</small></div>
<div class="ms-auto d-flex gap-2">
<button id="torchBtn" class="btn btn-sm btn-outline-light d-none"><i class="fa-solid fa-bolt"></i></button>
<button id="flipBtn" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-camera-rotate"></i></button>
</div>
</div>
<div class="stage">
<video id="nativePreview" playsinline muted autoplay></video>
<div class="frame"><div class="box"></div></div>
<div class="hint">Point QR inside green box</div>
</div>
<div class="panel">
<div id="statusBox" class="alert alert-info py-2 mb-2"><span id="statusText">Tap Start Camera, then Allow.</span></div>
<div class="small text-muted mb-1">Secure: <b id="secureState">?</b> | <span id="debugLine"></span></div>
<div id="resultBox" class="d-none"></div>
<div class="d-grid gap-2 mt-2">
<button id="startBtn" class="btn btn-kp btn-lg" onclick="startScan()">Start Camera</button>
<button class="btn btn-outline-danger" onclick="stopScan()">Stop</button>
<div class="row g-2">
<div class="col-6"><label class="btn btn-outline-secondary w-100 mb-0">Upload QR<input id="fileInput" type="file" accept="image/*" hidden></label></div>
<div class="col-6"><button class="btn btn-outline-secondary w-100" onclick="document.getElementById('manualId').focus()">Enter ID</button></div>
</div>
<div class="row g-2">
<div class="col-8"><input id="manualId" class="form-control" placeholder="kp_pass_..."></div>
<div class="col-4"><button class="btn btn-kp w-100" onclick="verifyManual()">Verify</button></div>
</div>
<a href="/staff/dashboard" class="btn btn-light">Back to Dashboard</a>
</div>
</div>
<div id="qrTmp" style="display:none"></div>
<script src="/static/js/auth.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/static/js/staff_scan.js"></script>
</body>
</html>
